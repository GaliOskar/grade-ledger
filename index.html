<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECE Grade Ledger</title>
  <meta name="description" content="Personal GPA and degree-progress tracker for the NU BEng in Electrical and Computer Engineering.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233346d3'/%3E%3Cpath d='M8 22h4V14H8zm6 0h4V9h-4zm6 0h4v-6h-4z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('eceTracker.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#semesters">Skip to semesters</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Grade Ledger</h1>
          <p class="brand-sub">BEng Electrical &amp; Computer Engineering · Nazarbayev University</p>
        </div>
      </div>
      <div class="toolbar">
        <span id="saved" class="saved" role="status" aria-live="polite"></span>
        <button type="button" class="btn btn-ghost" id="export-btn">Export</button>
        <button type="button" class="btn btn-ghost" id="import-btn">Import</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <button type="button" class="btn btn-icon" id="theme-btn" aria-label="Toggle dark mode"></button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="flash" class="flash" role="alert" hidden></div>

    <section id="summary" class="summary" aria-label="Summary"></section>

    <section id="progress" class="card" aria-labelledby="progress-h"></section>

    <div class="grid-insights">
      <section id="trend" class="card" aria-labelledby="trend-h"></section>
      <div class="stack">
        <section id="calc" class="card" aria-labelledby="calc-h"></section>
        <section id="spread" class="card" aria-labelledby="spread-h"></section>
      </div>
    </div>

    <section id="semesters" class="block" aria-labelledby="semesters-h" tabindex="-1"></section>

    <section id="plan" class="block" aria-labelledby="plan-h"></section>

    <section id="settings" class="card" aria-labelledby="settings-h"></section>
  </main>

  <footer class="wrap footer">
    <p>Your data stays in this browser (localStorage). Use Export to back it up.</p>
  </footer>

  <script src="curriculum.js"></script>
  <script src="app.js"></script>
</body>
</html>
